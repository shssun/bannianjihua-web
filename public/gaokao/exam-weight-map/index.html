<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>甘肃新高考（物化生）六科考点权重思维导图 · 2027届</title>
<style>
:root{
  --bg:#0d1117; --bg2:#010409; --panel:#161b22; --panel2:#1c2128;
  --bd:#30363d; --bd2:#3d444d;
  --tx:#e6edf3; --tx2:#adbac7; --tx3:#768390;
  --S:#f85149; --A:#ffa657; --B:#58a6ff; --C:#8b949e;
  --acc:#3fb950;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; overflow:hidden;
}
/* ---------- 顶栏 ---------- */
header{
  height:60px; display:flex; align-items:center; gap:16px; padding:0 18px;
  background:linear-gradient(180deg,#161b22,#0d1117);
  border-bottom:1px solid var(--bd); flex:0 0 auto;
}
header h1{font-size:16px; margin:0; font-weight:650; letter-spacing:.3px; white-space:nowrap;}
.badge-cal{
  font-size:11.5px; color:var(--tx2); background:var(--panel2);
  border:1px solid var(--bd2); border-radius:999px; padding:4px 11px; white-space:nowrap;
}
.badge-cal b{color:var(--A); font-weight:600;}
.spacer{flex:1;}
.hbtn{
  background:var(--panel2); color:var(--tx2); border:1px solid var(--bd2);
  border-radius:6px; padding:6px 11px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  font-family:inherit;
}
.hbtn:hover{background:#262c36; color:var(--tx);}
.hbtn.on{background:rgba(63,185,80,.15); border-color:var(--acc); color:var(--acc);}

/* ---------- 科目 Tab ---------- */
.tabs{
  display:flex; gap:6px; padding:10px 18px 0; background:var(--bg);
  border-bottom:1px solid var(--bd); flex:0 0 auto; overflow-x:auto;
}
.tab{
  padding:9px 16px; font-size:13.5px; color:var(--tx3); cursor:pointer;
  border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0;
  white-space:nowrap; background:transparent; font-family:inherit;
  display:flex; align-items:center; gap:7px;
}
.tab:hover{color:var(--tx2);}
.tab.active{color:var(--tx); background:var(--panel); border-color:var(--bd); font-weight:600;}
.tab .dot{width:8px;height:8px;border-radius:50%;}
.tab .sub{font-size:11px;color:var(--tx3);font-weight:400;}

/* ---------- meta 条 ---------- */
.meta{
  padding:11px 18px; background:var(--panel); border-bottom:1px solid var(--bd);
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; flex:0 0 auto;
}
.chip{
  font-size:11.5px; padding:4px 10px; border-radius:6px;
  background:var(--panel2); border:1px solid var(--bd2); color:var(--tx2);
}
.chip b{color:var(--tx); font-weight:600;}
.chip.warn{background:rgba(248,81,73,.13); border-color:rgba(248,81,73,.45); color:#ffb3ad;}
.chip.warn b{color:#ff8580;}

/* ---------- 主体 ---------- */
#main{display:flex; flex:1 1 auto; min-height:0; position:relative;}
#stage{
  flex:1 1 auto; position:relative; overflow:hidden; cursor:grab;
  background:
    radial-gradient(circle at 20% 15%, rgba(88,166,255,.05), transparent 55%),
    radial-gradient(circle at 80% 80%, rgba(248,81,73,.04), transparent 55%),
    var(--bg2);
}
#stage.drag{cursor:grabbing;}
#canvas{position:absolute; top:0; left:0; transform-origin:0 0;}
#links{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}

/* ---------- 节点 ---------- */
.node{
  position:absolute; width:216px; min-height:50px; padding:8px 10px 8px 12px;
  border-radius:9px; border:1px solid var(--bd2); background:var(--panel);
  cursor:pointer; display:flex; flex-direction:column; justify-content:center;
  transition:box-shadow .15s, border-color .15s, transform .12s;
  user-select:none;
}
.node:hover{border-color:var(--tx3); box-shadow:0 0 0 3px rgba(255,255,255,.05);}
.node.sel{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.14);}
.node.hit{border-color:#ffe066; box-shadow:0 0 0 3px rgba(255,224,102,.28);}
.node .r1{display:flex; align-items:center; gap:6px;}
.node .bdg{
  font-size:9.5px; font-weight:700; line-height:1; padding:2.5px 5px; border-radius:4px;
  flex:0 0 auto; letter-spacing:.3px;
}
.node .nm{font-size:12.6px; line-height:1.35; font-weight:550; flex:1 1 auto;}
.node .r2{
  margin-top:3px; font-size:10.5px; color:var(--tx3); line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.node .sc{color:var(--tx2); font-weight:600;}
.node .tg{
  position:absolute; right:-9px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; border-radius:50%; background:var(--panel2);
  border:1px solid var(--bd2); color:var(--tx3); font-size:11px; line-height:16px;
  text-align:center; font-family:monospace;
}
.node.kids .tg{color:var(--tx2);}
.leafdot{color:var(--tx3); font-size:11px; opacity:.5;}

.w-S{background:rgba(248,81,73,.13); border-color:rgba(248,81,73,.5);}
.w-S .bdg{background:var(--S); color:#fff;}
.w-S .sc{color:#ff9b95;}
.w-A{background:rgba(255,166,87,.11); border-color:rgba(255,166,87,.45);}
.w-A .bdg{background:var(--A); color:#2b1a05;}
.w-A .sc{color:#ffc98a;}
.w-B{background:rgba(88,166,255,.10); border-color:rgba(88,166,255,.42);}
.w-B .bdg{background:var(--B); color:#04121f;}
.w-B .sc{color:#9cc9ff;}
.w-C{background:rgba(139,148,158,.10); border-color:rgba(139,148,158,.35);}
.w-C .bdg{background:var(--C); color:#0d1117;}
.w-C .nm{color:var(--tx2);}

.node.root{
  width:250px; min-height:64px; padding:12px 14px;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid var(--bd2);
}
.node.root .nm{font-size:16px; font-weight:700;}
.node.root .r2{font-size:11px;}
.node.mid{width:228px;}

/* ---------- 右侧详情 ---------- */
#side{
  width:330px; flex:0 0 auto; background:var(--panel); border-left:1px solid var(--bd);
  display:flex; flex-direction:column; overflow:hidden;
}
#side .hd{
  padding:12px 14px; border-bottom:1px solid var(--bd); font-size:12px;
  color:var(--tx3); letter-spacing:.5px; flex:0 0 auto;
}
#side .bd{padding:14px; overflow-y:auto; flex:1 1 auto;}
#side .tt{font-size:15px; font-weight:650; line-height:1.4; margin-bottom:10px;}
.kv{margin-bottom:12px;}
.kv .k{font-size:11px; color:var(--tx3); margin-bottom:4px; letter-spacing:.4px;}
.kv .v{font-size:12.8px; color:var(--tx2); line-height:1.6;}
.wtag{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:5px;}
.wtag.S{background:var(--S); color:#fff;}
.wtag.A{background:var(--A); color:#2b1a05;}
.wtag.B{background:var(--B); color:#04121f;}
.wtag.C{background:var(--C); color:#0d1117;}
.path{font-size:11px; color:var(--tx3); line-height:1.6; margin-bottom:12px;}
.legend{padding:12px 14px; border-top:1px solid var(--bd); font-size:11.5px; color:var(--tx3); flex:0 0 auto;}
.legend .li{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
.legend .sw{width:14px;height:14px;border-radius:3px;flex:0 0 auto;}
.legend .li span:last-child{color:var(--tx2);}

/* ---------- 底部工具 ---------- */
#bar{
  height:44px; flex:0 0 auto; background:var(--panel); border-top:1px solid var(--bd);
  display:flex; align-items:center; gap:8px; padding:0 18px; font-size:12px; color:var(--tx3);
}
#bar input{
  background:var(--bg2); border:1px solid var(--bd2); border-radius:6px;
  color:var(--tx); padding:5px 10px; font-size:12px; width:190px; font-family:inherit;
}
#bar input:focus{outline:none; border-color:var(--B);}
.zoombtn{
  background:var(--panel2); border:1px solid var(--bd2); color:var(--tx2);
  width:26px; height:24px; border-radius:5px; cursor:pointer; font-size:13px;
  line-height:1; font-family:inherit;
}
.zoombtn:hover{color:var(--tx);}
#stat{margin-left:auto; font-size:11.5px; color:var(--tx3);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#484f58;}
</style>
</head>
<body>

<header>
  <h1>甘肃新高考 · 六科考点权重思维导图</h1>
  <div class="badge-cal">适用：<b>2027届（现高三）</b> · 兰州/甘肃</div>
  <div class="badge-cal">语数英 <b>新高考全国Ⅱ卷</b> ｜ 物化生 <b>甘肃自主命题</b></div>
  <div class="spacer"></div>
  <button class="hbtn" id="btnExpand">全部展开</button>
  <button class="hbtn" id="btnCollapse">折叠到模块</button>
  <button class="hbtn" id="btnFit">适应窗口</button>
</header>

<div class="tabs" id="tabs"></div>
<div class="meta" id="meta"></div>

<div id="main">
  <div id="stage">
    <div id="canvas">
      <svg id="links"></svg>
    </div>
  </div>
  <div id="side">
    <div class="hd">节点详情</div>
    <div class="bd" id="sideBody">
      <div class="kv"><div class="v" style="color:var(--tx3); line-height:1.8">
        点击任意节点查看：权重等级 · 近三年分值 · 考查形式 · 备考提示。<br><br>
        权重口径：<br>
        <span class="wtag S" style="margin-right:6px">S</span>每年必考，分值 ≥12 分<br>
        <span class="wtag A" style="margin-right:6px">A</span>三年内多次出现，5–12 分<br>
        <span class="wtag B" style="margin-right:6px">B</span>隔年或轮换出现<br>
        <span class="wtag C" style="margin-right:6px">C</span>低频 / 扫盲型考点
      </div></div>
    </div>
    <div class="legend">
      <div class="li"><span class="sw" style="background:var(--S)"></span><span>S 核心必考 · 优先投入</span></div>
      <div class="li"><span class="sw" style="background:var(--A)"></span><span>A 高频 · 常规攻坚</span></div>
      <div class="li"><span class="sw" style="background:var(--B)"></span><span>B 中频 · 轮换扫盲</span></div>
      <div class="li"><span class="sw" style="background:var(--C)"></span><span>C 低频 · 考前过一遍</span></div>
    </div>
  </div>
</div>

<div id="bar">
  <span>权重筛选</span>
  <button class="hbtn on" data-w="S">S 核心</button>
  <button class="hbtn on" data-w="A">A 高频</button>
  <button class="hbtn on" data-w="B">B 中频</button>
  <button class="hbtn on" data-w="C">C 低频</button>
  <span style="margin-left:14px">搜索</span>
  <input autocomplete="off" id="q" placeholder="输入关键词定位节点">
  <span style="margin-left:14px">缩放</span>
  <button class="zoombtn" id="zo">−</button>
  <button class="zoombtn" id="zi">＋</button>
  <div id="stat"></div>
</div>

<script>
/* ============================================================
   权重等级：S 核心必考 / A 高频 / B 中频 / C 低频
   s: 近三年（2024-2026）该考点在甘肃卷或全国Ⅱ卷中的参考分值
   f: 出现频次描述
   t: 备考提示（考查形式 / 抢分要点）
   注意：甘肃 2022-2023 为老高考全国乙卷（理综），2024 起为新高考，
   故权重以 2024-2026 三年为主口径，2022-2023 仅作知识点热度参考。
   ============================================================ */

function N(n,w,s,f,t,c){return {n:n,w:w,s:s,f:f,t:t,c:c||null};}

const SUBJECTS = [
/* ============================ 数学 ============================ */
{
  key:'math', name:'数学', color:'#58a6ff', sub:'全国Ⅱ卷 · 150分/120分钟',
  meta:[
    ['卷别','新高考全国Ⅱ卷（教育部考试院命题）'],
    ['结构','8单选40 + 3多选18 + 3填空15 + 5解答77'],
    ['计分','150分 原始分计入'],
    ['三年趋势','结构三年完全一致；基础题约40%、中档45%、压轴15%']
  ],
  warn:'2022-2023 甘肃用全国乙卷（文理分科），2024 起才改用全国Ⅱ卷，旧卷只能补知识点、不能当套卷仿真',
  root:N('数学 · 全国Ⅱ卷','S','150分','2024-2026 结构恒定（8+3+3+5）',
    '压轴固定在导数（第18/19题）与解析几何/概率。保分战场＝前8单选＋前2-3填空＋前2道解答，约90-105分，一轮必须练到零失误。',[
  N('函数与导数','S','30–36分','2024-2026 每年必考，全卷分值最高',
    '第8题常把奇偶性/周期性/对称性三合一；第13题零点与参数；第19题压轴＝切线＋恒成立求参＋最值三问。一轮"见过、会第一问"，二三轮再冲完整。',[
    N('函数性质（奇偶/单调/周期/对称）','S','5分','每年 1 题',
      '抽象函数与具体函数结合考查逻辑推理，先把四条性质的等价变形练熟。'),
    N('导数几何意义与切线方程','A','5分','三年 2 次',
      '注意"在某点"与"过某点"的区别，是导数题的第一问送分口。'),
    N('导数与单调性/极值/最值','S','17分','每年 1 道大题',
      '分类讨论的分界点必须写全，步骤分密集，宁可写慢不可跳步。'),
    N('恒成立 / 能成立求参数','S','压轴第2问','2025、2026 连考',
      '两条路：构造差函数分类讨论、必要性探路 + 参数分离，二选一练到闭眼能做。'),
    N('不等式证明（含双变量）','A','压轴第3问','2024 考查',
      '端点效应 + 洛必达法则备用；双变量问题统一先减元再构造。'),
    N('指对幂比较大小','A','5分','隔年出现','统一取对数或找中间量0/1，别硬算。'),
    N('函数图像识别与零点','A','5分','2026 第13题','先定性（单调/极值/端点）再定量，图像题别逐个代入。')
  ]),
  N('解析几何','S','22–27分','2024-2026 每年 2 题 + 压轴候选',
    '2026 第11题抛物线＋等边三角形、第18题椭圆轨迹。计算量大但强调"几何性质优先、数形结合"，先定几何关系再动笔算。',[
    N('椭圆','S','12–17分','三年均考','定义、离心率、焦点三角形；大题常以椭圆为载体考定点定值与面积最值。'),
    N('双曲线','A','5分','2024、2026 考查','渐近线、离心率、定义式 |PF₁−PF₂|=2a，小题为主。'),
    N('抛物线','A','5–11分','2024、2026 考查','定义转化（到焦点距离＝到准线距离）是提速关键。'),
    N('直线与圆','A','5分','隔年出现','弦长、切线、隐形圆与距离最值；2025 全国卷考过隐形圆。'),
    N('圆锥曲线综合（定点/定值/弦长/面积最值）','S','17分','每年第18题位置',
      '设而不求 + 韦达定理是标准动作，务必练到"看见直线联立就条件反射"。')
  ]),
  N('立体几何','S','19–22分','2024-2026 每年 1 道解答',
    '2026 第16题三棱锥线面垂直证明＋线面角。空间向量法因代数化程度高已成为主流，同时保留体积法等几何法作第二路径。',[
    N('空间向量法求角与距离','S','15分','每年解答题','建系→写坐标→求法向量→套公式，流程化训练性价比最高。'),
    N('位置关系证明（线面平行/垂直、面面垂直）','S','解答第1问','每年必考','第一问必须拿满，定理条件（线在面内、两线相交）不能漏写。'),
    N('几何体表面积/体积与外接球','A','5分','2024 三棱台、2026 第14题','补形法、墙角模型、汉堡模型三大套路要背熟。'),
    N('折叠与展开问题','A','5分','2025 四边形折叠','折叠前后不变量是突破口，先标不变关系再算。')
  ]),
  N('概率与统计','S','18–22分','2024-2026 每年 1–2 题',
    '2026 第15题电子元件故障检测：频率分布直方图 + 二项分布期望方差。情境化极强，2025 出现过"乒乓球随机游走"反套路压轴。',[
    N('统计：直方图/数字特征/独立性检验/回归','A','5–15分','三年均考','分位数定位、频率×组距 公式最容易混，单独做一轮专项。'),
    N('概率：分布列、期望方差、二项分布','S','15分','每年 1 道解答','先识别模型（二项/超几何/独立重复）再列式，识别错＝全题错。'),
    N('条件概率与全概率','A','5分','2026 涉及','公式要记准，画树状图比套公式稳。'),
    N('排列组合与计数原理','A','5分','2026 第6题','分组分配问题必须分类讨论，平均分组要除以阶乘。'),
    N('概率新定义 / 随机游走类压轴','B','压轴','2025 出现','重建模轻套路，一轮不必深耕，二轮集中见题型。')
  ]),
  N('数列','A','15–20分','2024-2026 每年选择 + 解答',
    '2026 第10题等比数列前n项和性质、第12题。公比为负时项正负交替是最常见失分点。',[
    N('等差 / 等比数列通项与求和','S','5–15分','每年必考','基本量法（首项+公差/公比）是万能解，先设再列。'),
    N('错位相减 / 裂项 / 倒序求和','A','5分','隔年出现','三种求和法各练5道，形成条件反射。'),
    N('递推数列与构造','A','5分','三年 2 次','一阶线性递推构造等比，二阶用特征根（可作了解）。'),
    N('数列与函数/导数/不等式综合','B','压轴候选','2025 出现','数列放缩常用"裂项放缩"与"单调有界"，别在通项上死磕。')
  ]),
  N('三角函数与解三角形','A','15–20分','2024-2026 每年 1 道解答',
    '2026 第17题：余弦定理证钝角三角形 → 正弦定理＋面积公式求周长。定位为中档题，一轮要专题突破拿满步骤分。',[
    N('解三角形（正/余弦定理、面积、周长）','S','15分','每年 1 道解答','先判断解的个数（SSS/SAS/SSA），再选定理，避免漏解。'),
    N('三角恒等变换与图像性质','A','5分','每年选择填空','和差倍半、辅助角公式、y=Asin(ωx+φ) 三参数。'),
    N('平面向量','A','5分','每年 1 题','几何意义（极化恒等式、投影）比坐标法快一倍。')
  ]),
  N('基础送分模块','C','10–16分','每年第1-3题',
    '集合与复数三年固定在第1、2题，属于必须零失误的送分区，但每年都有人算错。',[
    N('集合与常用逻辑用语','C','5分','每年 1 题','补集、子集、充分必要条件，3分钟内解决。'),

const NODE_W = 216, NODE_H = 66, GAP_Y = 12, COL_GAP = 258;
let cur = SUBJECTS[0];
let scale = 1, tx = 60, ty = 40;
let selNode = null;
const collapsed = new Set();
const filterW = new Set(['S','A','B','C']);
let query = '';

const $ = id => document.getElementById(id);
const stage=$('stage'), canvas=$('canvas'), svg=$('links'), sideBody=$('sideBody');

/* --- 可见子节点（考虑折叠 + 权重筛选 + 搜索） --- */
function visibleChildren(node){
  let kids = node.c || [];
  if(filterW.size < 4){
    kids = kids.filter(k => subtreeMatch(k));
  }
  return kids;
}
function weightOk(n){ return filterW.has(n.w); }
function subtreeMatch(n){
  if(query){ if(hasQuery(n)) return true; }
  if(weightOk(n)) return true;
  return (n.c||[]).some(subtreeMatch);
}
function hasQuery(n){
  if(!query) return false;
  const s=(n.n+' '+(n.s||'')+' '+(n.f||'')+' '+(n.t||'')).toLowerCase();
  if(s.includes(query)) return true;
  return (n.c||[]).some(hasQuery);
}

function isCollapsed(node){ return collapsed.has(node) && (node.c||[]).length>0; }

/* --- 布局 --- */
let cursorY = 0;
function layout(node, depth){
  node._x = depth * COL_GAP;
  const kids = isCollapsed(node) ? [] : visibleChildren(node);
  if(kids.length===0){
    node._y = cursorY;
    cursorY += NODE_H + GAP_Y;
  }else{
    kids.forEach(k=>layout(k, depth+1));
    node._y = (kids[0]._y + kids[kids.length-1]._y)/2;
  }
}

/* --- 绘制 --- */
let nodeEls = [], linkPaths = [];
function render(){
  cursorY = 0;
  layout(cur.root, 0);
  const maxDepth = (function d(n){ 
    const k = isCollapsed(n)?[]:visibleChildren(n);
    return k.length? 1+Math.max(...k.map(d)) : 0; })(cur.root);
  const W = maxDepth*COL_GAP + NODE_W + 80;
  const H = Math.max(cursorY + 60, 400);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  svg.setAttribute('width', W); svg.setAttribute('height', H);

  nodeEls.forEach(e=>e.remove());
  nodeEls=[]; linkPaths=[];
  let pathsHTML='';

  (function walk(node, depth, parent){
    const el = document.createElement('div');
    const kids = isCollapsed(node)?[]:visibleChildren(node);
    const isRoot = depth===0;
    el.className = 'node w-'+node.w + (isRoot?' root':'') + (depth===1?' mid':'');
    if(node===selNode) el.classList.add('sel');
    if(query && hasQuery(node)) el.classList.add('hit');
    el.style.left = node._x+'px';
    el.style.top  = node._y+'px';
    if(depth===0){ el.style.minHeight='78px'; }

    const bdgW = {S:'S',A:'A',B:'B',C:'C'}[node.w];
    let h = '<div class="r1"><span class="bdg">'+bdgW+'</span><span class="nm">'+esc(node.n)+'</span></div>';
    h += '<div class="r2"><span class="sc">'+esc(node.s||'')+'</span>'+
         (node.f? ' · '+esc(node.f):'')+'</div>';
    el.innerHTML = h;
    if((node.c||[]).length>0){
      el.classList.add('kids');
      const tg=document.createElement('div');
      tg.className='tg';
      tg.textContent = isCollapsed(node)? '+':'−';
      tg.onclick = e=>{ e.stopPropagation(); isCollapsed(node)?collapsed.delete(node):collapsed.add(node); render(); };
      el.appendChild(tg);
    }
    el.onclick = ()=>{ selNode=node; showDetail(node, pathOf(node)); render(); };
    canvas.appendChild(el);
    nodeEls.push(el);

    if(parent){
      const x1 = parent._x + (depth===1?250:NODE_W), y1 = parent._y + (depth===1?32:NODE_H/2);
      const x2 = node._x, y2 = node._y + NODE_H/2;
      const mx = (x1+x2)/2;
      pathsHTML += '<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" '+
        'fill="none" stroke="'+linkColor(node.w)+'" stroke-width="'+(depth===1?2:1.4)+'" stroke-opacity="'+(depth===1?.75:.45)+'"/>';
    }
    kids.forEach(k=>walk(k, depth+1, node));
  })(cur.root, 0, null);

  svg.innerHTML = pathsHTML;
  applyTransform();
  $('stat').textContent = '当前显示 '+nodeEls.length+' 个节点 · '+cur.name+' · '+cur.sub;
}
function linkColor(w){
  return {S:'#f85149',A:'#ffa657',B:'#58a6ff',C:'#8b949e'}[w] || '#484f58';
}
function esc(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function pathOf(target){
  const p=[];
  (function w(n, trail){
    if(n===target){ p.push(...trail, n.n); return true; }
    for(const k of (n.c||[])){ if(w(k, trail.concat([n.n]))) return true; }
    return false;
  })(cur.root, []);
  return p;
}
function applyTransform(){
  canvas.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
}
function showDetail(node, path){
  const wname={S:'S 核心必考',A:'A 高频',B:'B 中频',C:'C 低频'}[node.w];
  let h = '<div class="path">'+path.map(esc).join(' › ')+'</div>';
  h += '<div class="tt">'+esc(node.n)+'</div>';
  h += '<div class="kv"><div class="k">权重等级</div><div class="v"><span class="wtag '+node.w+'">'+wname+'</span></div></div>';
  if(node.s) h += '<div class="kv"><div class="k">参考分值（2024-2026）</div><div class="v">'+esc(node.s)+'</div></div>';
  if(node.f) h += '<div class="kv"><div class="k">出现频次</div><div class="v">'+esc(node.f)+'</div></div>';
  if(node.t) h += '<div class="kv"><div class="k">考查形式与备考提示</div><div class="v">'+esc(node.t)+'</div></div>';
  sideBody.innerHTML = h;
  sideBody.scrollTop = 0;
}

/* --- 交互 --- */
function buildTabs(){
  const t=$('tabs'); t.innerHTML='';
  SUBJECTS.forEach(s=>{
    const b=document.createElement('button');
    b.className='tab'+(s===cur?' active':'');
    b.innerHTML='<span class="dot" style="background:'+s.color+'"></span>'+s.name+
                '<span class="sub">'+s.sub+'</span>';
    b.onclick=()=>{ cur=s; selNode=null; collapseToModules(); buildTabs(); buildMeta(); render(); fit(); };
    t.appendChild(b);
  });
}
function buildMeta(){
  const m=$('meta'); m.innerHTML='';
  cur.meta.forEach(([k,v])=>{
    const d=document.createElement('div'); d.className='chip';
    d.innerHTML='<b>'+k+'</b> · '+v; m.appendChild(d);
  });
  if(cur.warn){
    const d=document.createElement('div'); d.className='chip warn';
    d.innerHTML='⚠ <b>口径提示</b> · '+cur.warn; m.appendChild(d);
  }
}
function fit(){
  const r=stage.getBoundingClientRect();
  const cw=parseFloat(canvas.style.width), ch=parseFloat(canvas.style.height);
  /* 下限 0.72：宁可溢出拖动也不缩成看不清的小字（2026-10-20 版式修复） */
  scale = Math.max(0.72, Math.min(r.width/cw, r.height/ch, 1.05));
  tx = Math.max(20,(r.width - cw*scale)/2);
  ty = Math.max(10,(r.height - ch*scale)/2);
  applyTransform();
}

/* 拖拽平移 */
let dragging=false, sx=0, sy=0, ox=0, oy=0;
stage.addEventListener('mousedown', e=>{
  if(e.target.closest('.node')) return;
  dragging=true; sx=e.clientX; sy=e.clientY; ox=tx; oy=ty; stage.classList.add('drag');
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return; tx=ox+(e.clientX-sx); ty=oy+(e.clientY-sy); applyTransform();
});
window.addEventListener('mouseup', ()=>{dragging=false; stage.classList.remove('drag');});
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f = e.deltaY<0?1.1:0.9;
  const ns=Math.max(.25,Math.min(1.8, scale*f));
  tx = mx - (mx-tx)*(ns/scale); ty = my - (my-ty)*(ns/scale); scale=ns; applyTransform();
},{passive:false});

/* 按钮 */
$('btnExpand').onclick=()=>{ collapsed.clear(); render(); };
function collapseToModules(){
  collapsed.clear();
  (cur.root.c||[]).forEach(m=>{ if((m.c||[]).length) collapsed.add(m); });
}
$('btnCollapse').onclick=()=>{ collapseToModules(); render(); fit(); };
$('btnFit').onclick=fit;
$('zi').onclick=()=>{scale=Math.min(1.8,scale*1.15);applyTransform();};
$('zo').onclick=()=>{scale=Math.max(.25,scale/1.15);applyTransform();};
document.querySelectorAll('[data-w]').forEach(b=>{
  b.onclick=()=>{
    const w=b.dataset.w;
    if(filterW.has(w)){ filterW.delete(w); b.classList.remove('on'); }
    else { filterW.add(w); b.classList.add('on'); }
    render();
  };
});
$('q').addEventListener('input', e=>{
  query = e.target.value.trim().toLowerCase();
  if(query){ collapsed.clear(); }
  render();
});

buildTabs(); buildMeta(); collapseToModules(); render(); fit();
window.addEventListener('resize', ()=>{ /* 保持当前视图 */ });
</script>
</body>
</html>
