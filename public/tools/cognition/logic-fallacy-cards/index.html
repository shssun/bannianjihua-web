<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>逻辑谬误卡片</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #111827;
        --muted: #4b5563;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --primary: #0ea5e9;
        --primary-soft: rgba(14, 165, 233, 0.12);
        --badge-bg: rgba(220, 38, 38, 0.1);
        --badge-fg: #dc2626;
      }
      html[data-theme='dark'] {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --card: #111827;
        --border: rgba(148, 163, 184, 0.2);
        --primary: #38bdf8;
        --primary-soft: rgba(56, 189, 248, 0.14);
        --badge-bg: rgba(248, 113, 113, 0.16);
        --badge-fg: #fca5a5;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .toolbar h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
      button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      button:hover { border-color: var(--primary); color: var(--primary); }

      .notice {
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: var(--card);
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.7;
      }
      .notice strong { color: var(--fg); }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: border-color 0.15s ease;
      }
      .card:hover { border-color: var(--primary); }

      .card .badge {
        align-self: flex-start;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--badge-bg);
        color: var(--badge-fg);
      }
      .card h3 { margin: 0; font-size: 1.05rem; }
      .card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.7; }
      .card .example {
        font-size: 0.82rem;
        border-left: 3px solid var(--primary);
        background: var(--primary-soft);
        padding: 8px 10px;
        border-radius: 0 8px 8px 0;
        color: var(--fg);
      }
      .card .example span { color: var(--muted); }

      .hint { font-size: 0.75rem; color: var(--muted); margin-top: 16px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1>🧩 逻辑谬误卡片（静态图集展示）</h1>
      <div>
        <button id="open-new-tab" type="button">在新标签打开</button>
      </div>
    </div>

    <div class="notice">
      <strong>说明：</strong>本工具的正式产物是「公众号长文 → 深色信息图卡（PNG）」，
      其生成依赖无头 Chrome，无法在纯静态/浏览器端实时运行。
      因此站点上以 <strong>「已生成图集静态展示」</strong>形态呈现（<code>runtime: light-backend</code>）。
      下方为卡片示例占位，正式图集（一批 PNG）请放入 <code>public/tools/logic-fallacy-cards/</code> 后替换本页。
    </div>

    <div class="grid" id="cards"></div>

    <p class="hint">
      主题跟随主站深浅色自动切换；本页为自包含单文件，离线可打开。
    </p>

    <script>
      (function () {
        'use strict';

        // ===== 示例卡片数据（占位）=====
        var CARDS = [
          {
            tag: '稻草人谬误',
            title: '稻草人',
            desc: '歪曲对方的观点后再加以攻击，攻击的是一个更容易击倒的「稻草人」。',
            example: '甲：应适度增加教育投入。乙：所以你想把纳税人的钱全砸进学校？',
          },
          {
            tag: '诉诸人身',
            title: '人身攻击',
            desc: '不针对论点本身，转而攻击提出论点的人。',
            example: '他连大学都没上过，他说的方法肯定不对。',
          },
          {
            tag: '滑坡谬误',
            title: '滑坡',
            desc: '断言一个微小举动必将引发一连串极端后果，却缺乏充分论证。',
            example: '今天允许迟到，明天就会不交作业，后天就要退学了。',
          },
          {
            tag: '虚假两难',
            title: '虚假两难',
            desc: '把本有多种可能的问题强行压缩成「非此即彼」两个选项。',
            example: '你要么完全支持我们，要么就是我们的敌人。',
          },
          {
            tag: '以偏概全',
            title: '以偏概全',
            desc: '用样本量过小或缺乏代表性的例子，推出普遍结论。',
            example: '我认识的三个程序员都爱喝咖啡，看来程序员都爱喝咖啡。',
          },
          {
            tag: '循环论证',
            title: '循环论证',
            desc: '把结论当作前提，用结论来证明前提，原地打转。',
            example: '这本书一定可信，因为它说的都是真话；而它说自己是真话，所以可信。',
          },
        ];

        var grid = document.getElementById('cards');

        function renderCards() {
          grid.innerHTML = '';
          CARDS.forEach(function (item) {
            var card = document.createElement('div');
            card.className = 'card';
            var badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = item.tag;
            var title = document.createElement('h3');
            title.textContent = item.title;
            var desc = document.createElement('div');
            desc.className = 'desc';
            desc.textContent = item.desc;
            var example = document.createElement('div');
            example.className = 'example';
            example.innerHTML = '<span>例：</span>' + item.example;
            card.appendChild(badge);
            card.appendChild(title);
            card.appendChild(desc);
            card.appendChild(example);
            grid.appendChild(card);
          });
        }

        // ===== postMessage 协议 =====
        function reportHeight() {
          var height = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight,
          );
          window.parent.postMessage({ type: 'resize', height: height }, '*');
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (data && data.type === 'theme' && (data.value === 'light' || data.value === 'dark')) {
            document.documentElement.setAttribute('data-theme', data.value);
          }
        });

        document.getElementById('open-new-tab').addEventListener('click', function () {
          window.open(window.location.href, '_blank', 'noopener');
        });

        // 初始化
        renderCards();
        reportHeight();
        window.addEventListener('resize', reportHeight);
      })();
    </script>
  </body>
</html>
