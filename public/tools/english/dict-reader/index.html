<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英语句读器</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #111827;
        --muted: #4b5563;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --primary: #0ea5e9;
        --primary-soft: rgba(14, 165, 233, 0.12);
      }
      html[data-theme='dark'] {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --card: #111827;
        --border: rgba(148, 163, 184, 0.2);
        --primary: #38bdf8;
        --primary-soft: rgba(56, 189, 248, 0.14);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .toolbar h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
      button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      button:hover { border-color: var(--primary); color: var(--primary); }

      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 16px;
      }

      .sentence {
        padding: 14px 0;
        border-bottom: 1px dashed var(--border);
        line-height: 2.1;
      }
      .sentence:last-child { border-bottom: none; }

      /* 可点词 */
      .word {
        cursor: pointer;
        border-radius: 5px;
        padding: 1px 3px;
        transition: background 0.15s ease, color 0.15s ease;
        position: relative;
      }
      .word:hover,
      .word.active {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .translation {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 2px;
      }

      /* 查询弹窗 */
      .popup {
        position: absolute;
        z-index: 20;
        min-width: 200px;
        max-width: 280px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        font-size: 0.82rem;
        line-height: 1.55;
      }
      .popup .head { font-weight: 700; color: var(--primary); }
      .popup .phonetic { color: var(--muted); font-style: italic; margin: 2px 0 6px; }
      .popup .close {
        position: absolute;
        top: 6px;
        right: 8px;
        cursor: pointer;
        color: var(--muted);
        font-size: 0.9rem;
        border: none;
        background: transparent;
        padding: 0;
      }
      .hint { font-size: 0.75rem; color: var(--muted); margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1>🔤 英语句读器（迷你演示）</h1>
      <div>
        <button id="open-new-tab" type="button">在新标签打开</button>
      </div>
    </div>

    <div class="panel" id="reader"></div>

    <p class="hint">
      点击任意单词查看音标与释义（内置离线迷你词典演示）。主题跟随主站，离线可用。
      正式版本（句子清单 → 完整词典阅读器）将由老板后续替换本文件。
    </p>

    <script>
      (function () {
        'use strict';

        // ===== 迷你离线词典（演示用）=====
        var DICT = {
          learning: { phonetic: '/ˈlɜːnɪŋ/', pos: 'n.', meaning: '学习；学问' },
          english: { phonetic: '/ˈɪŋɡlɪʃ/', pos: 'n./adj.', meaning: '英语；英国的' },
          words: { phonetic: '/wɜːdz/', pos: 'n.', meaning: '单词（word 的复数）' },
          one: { phonetic: '/wʌn/', pos: 'num.', meaning: '一；一个' },
          at: { phonetic: '/æt/', pos: 'prep.', meaning: '在；向；以' },
          a: { phonetic: '/ə/', pos: 'art.', meaning: '一个（不定冠词）' },
          time: { phonetic: '/taɪm/', pos: 'n.', meaning: '时间；次数' },
          keeps: { phonetic: '/kiːps/', pos: 'v.', meaning: '保持（keep 的第三人称单数）' },
          the: { phonetic: '/ðə/', pos: 'art.', meaning: '这；那（定冠词）' },
          doctor: { phonetic: '/ˈdɒktə/', pos: 'n.', meaning: '医生；博士' },
          away: { phonetic: '/əˈweɪ/', pos: 'adv.', meaning: '离开；远离' },
          small: { phonetic: '/smɔːl/', pos: 'adj.', meaning: '小的；少量的' },
          steps: { phonetic: '/steps/', pos: 'n.', meaning: '步骤（step 的复数）' },
          every: { phonetic: '/ˈevri/', pos: 'det.', meaning: '每一个' },
          day: { phonetic: '/deɪ/', pos: 'n.', meaning: '天；白天' },
          practice: { phonetic: '/ˈpræktɪs/', pos: 'n./v.', meaning: '练习；实践' },
          makes: { phonetic: '/meɪks/', pos: 'v.', meaning: '使得（make 的第三人称单数）' },
          perfect: { phonetic: '/ˈpɜːfɪkt/', pos: 'adj.', meaning: '完美的' },
          reading: { phonetic: '/ˈriːdɪŋ/', pos: 'n.', meaning: '阅读' },
          broadens: { phonetic: '/ˈbrɔːdnz/', pos: 'v.', meaning: '拓宽（broaden 的第三人称单数）' },
          mind: { phonetic: '/maɪnd/', pos: 'n.', meaning: '头脑；思想' },
          knowledge: { phonetic: '/ˈnɒlɪdʒ/', pos: 'n.', meaning: '知识' },
          is: { phonetic: '/ɪz/', pos: 'v.', meaning: '是（be 的第三人称单数）' },
          power: { phonetic: '/ˈpaʊə/', pos: 'n.', meaning: '力量；能力' },
        };

        // ===== 句子清单（演示数据）=====
        var SENTENCES = [
          {
            en: 'Learning English words one at a time keeps the doctor away.',
            zh: '一次学一个英语单词，能让医生远离你。',
          },
          {
            en: 'Small steps every day makes perfect practice.',
            zh: '每天迈出一小步，成就完美的练习。',
          },
          {
            en: 'Reading broadens the mind, and knowledge is power.',
            zh: '阅读开阔心智，而知识就是力量。',
          },
        ];

        var reader = document.getElementById('reader');
        var activeWord = null;

        /** 将英文句子拆成可点击单词（保留标点）。 */
        function buildSentence(sentence) {
          var container = document.createElement('div');
          container.className = 'sentence';

          var enLine = document.createElement('div');
          var tokens = sentence.en.split(/(\b[A-Za-z']+\b)/g);
          tokens.forEach(function (token) {
            if (/^[A-Za-z']+$/.test(token)) {
              var span = document.createElement('span');
              span.className = 'word';
              span.textContent = token;
              span.dataset.word = token.toLowerCase();
              enLine.appendChild(span);
            } else if (token.length > 0) {
              enLine.appendChild(document.createTextNode(token));
            }
          });

          var zh = document.createElement('span');
          zh.className = 'translation';
          zh.textContent = sentence.zh;

          container.appendChild(enLine);
          container.appendChild(zh);
          return container;
        }

        /** 显示查词弹窗。 */
        function showPopup(anchor, word) {
          closePopup();
          var entry = DICT[word];
          if (!entry) {
            return;
          }

          var popup = document.createElement('div');
          popup.className = 'popup';
          popup.innerHTML =
            '<button class="close" type="button" aria-label="关闭">✕</button>' +
            '<div class="head">' + word + '</div>' +
            '<div class="phonetic">' + entry.phonetic + ' &nbsp; ' + entry.pos + '</div>' +
            '<div>' + entry.meaning + '</div>';

          document.body.appendChild(popup);

          var rect = anchor.getBoundingClientRect();
          var top = rect.bottom + window.scrollY + 6;
          var left = rect.left + window.scrollX;
          // 边界处理：不超出右侧
          var maxLeft = window.scrollX + document.documentElement.clientWidth - 300;
          if (left > maxLeft) {
            left = Math.max(window.scrollX + 8, maxLeft);
          }
          popup.style.top = top + 'px';
          popup.style.left = left + 'px';

          popup.querySelector('.close').addEventListener('click', function (e) {
            e.stopPropagation();
            closePopup();
          });

          anchor.classList.add('active');
          activeWord = anchor;
          reportHeight();
        }

        function closePopup() {
          var existing = document.querySelector('.popup');
          if (existing) {
            existing.remove();
          }
          if (activeWord) {
            activeWord.classList.remove('active');
            activeWord = null;
          }
        }

        reader.addEventListener('click', function (event) {
          var target = event.target;
          if (target && target.classList && target.classList.contains('word')) {
            showPopup(target, target.dataset.word);
          } else {
            closePopup();
          }
        });

        // ===== postMessage 协议 =====
        function reportHeight() {
          var height = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight,
          );
          window.parent.postMessage({ type: 'resize', height: height }, '*');
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (data && data.type === 'theme' && (data.value === 'light' || data.value === 'dark')) {
            document.documentElement.setAttribute('data-theme', data.value);
          }
        });

        document.getElementById('open-new-tab').addEventListener('click', function () {
          window.open(window.location.href, '_blank', 'noopener');
        });

        // 初始化
        SENTENCES.forEach(function (s) {
          reader.appendChild(buildSentence(s));
        });
        reportHeight();
        window.addEventListener('resize', reportHeight);
      })();
    </script>
  </body>
</html>
