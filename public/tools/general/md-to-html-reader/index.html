<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 阅读器</title>
    <style>
      /* ===== 主题变量（与主站主题变量语义对齐）===== */
      :root {
        --bg: #f8fafc;
        --fg: #111827;
        --muted: #4b5563;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --primary: #0ea5e9;
        --primary-soft: rgba(14, 165, 233, 0.12);
        --code: #f1f5f9;
      }
      html[data-theme='dark'] {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --card: #111827;
        --border: rgba(148, 163, 184, 0.2);
        --primary: #38bdf8;
        --primary-soft: rgba(56, 189, 248, 0.14);
        --code: #0f172a;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .toolbar h1 {
        font-size: 1.05rem;
        margin: 0;
        font-weight: 700;
      }
      .toolbar .actions {
        display: flex;
        gap: 8px;
      }
      button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      button:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 14px;
      }
      .panel h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      textarea {
        width: 100%;
        min-height: 260px;
        resize: vertical;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.6;
      }
      .preview {
        min-height: 260px;
        overflow-x: auto;
        line-height: 1.75;
        word-break: break-word;
      }
      .preview h1 { font-size: 1.6rem; }
      .preview h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
      .preview h3 { font-size: 1.1rem; }
      .preview code {
        font-family: ui-monospace, monospace;
        background: var(--primary-soft);
        padding: 0.1em 0.35em;
        border-radius: 5px;
        font-size: 0.9em;
      }
      .preview pre {
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
      }
      .preview pre code {
        background: transparent;
        padding: 0;
      }
      .preview blockquote {
        border-left: 3px solid var(--primary);
        background: var(--primary-soft);
        margin: 0;
        padding: 0.4em 1em;
        border-radius: 0 8px 8px 0;
        color: var(--muted);
      }
      .preview a { color: var(--primary); }
      .preview table { border-collapse: collapse; width: 100%; }
      .preview th, .preview td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
      }
      .preview th { background: var(--primary-soft); }
      .preview ul, .preview ol { padding-left: 1.4em; }
      .hint {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1>📖 Markdown 阅读器（迷你演示）</h1>
      <div class="actions">
        <button id="open-new-tab" type="button">在新标签打开</button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Markdown 输入</h2>
        <textarea id="md-input" spellcheck="false"></textarea>
      </div>
      <div class="panel">
        <h2>实时预览</h2>
        <div id="md-preview" class="preview"></div>
      </div>
    </div>

    <p class="hint">
      这是一个功能可用的迷你演示：纯前端 Markdown 渲染，离线可用，主题跟随主站。
      正式版本（文件夹 → 单文件阅读器）将由老板后续替换本文件。
    </p>

    <script>
      (function () {
        'use strict';

        // ===== 迷你 Markdown 渲染（覆盖常见语法，纯前端、无外部依赖）=====
        function escapeHtml(text) {
          return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        }

        function renderInline(text) {
          let out = escapeHtml(text);
          out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
          out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
          out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
          return out;
        }

        function renderMarkdown(md) {
          var lines = md.replace(/\r\n/g, '\n').split('\n');
          var html = [];
          var i = 0;

          function flushList(tag, items) {
            html.push('<' + tag + '>' + items.map(function (t) { return '<li>' + renderInline(t) + '</li>'; }).join('') + '</' + tag + '>');
          }

          while (i < lines.length) {
            var line = lines[i];

            // 代码块
            if (/^```/.test(line)) {
              var lang = line.slice(3).trim();
              var codeLines = [];
              i++;
              while (i < lines.length && !/^```/.test(lines[i])) {
                codeLines.push(lines[i]);
                i++;
              }
              i++;
              html.push('<pre><code data-lang="' + escapeHtml(lang) + '">' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
              continue;
            }

            // 标题
            var heading = /^(#{1,6})\s+(.*)$/.exec(line);
            if (heading) {
              var level = heading[1].length;
              html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
              i++;
              continue;
            }

            // 引用
            if (/^>\s?/.test(line)) {
              var quotes = [];
              while (i < lines.length && /^>\s?/.test(lines[i])) {
                quotes.push(lines[i].replace(/^>\s?/, ''));
                i++;
              }
              html.push('<blockquote>' + renderInline(quotes.join(' ')) + '</blockquote>');
              continue;
            }

            // 无序列表
            if (/^[-*+]\s+/.test(line)) {
              var ulItems = [];
              while (i < lines.length && /^[-*+]\s+/.test(lines[i])) {
                ulItems.push(lines[i].replace(/^[-*+]\s+/, ''));
                i++;
              }
              flushList('ul', ulItems);
              continue;
            }

            // 有序列表
            if (/^\d+\.\s+/.test(line)) {
              var olItems = [];
              while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
                olItems.push(lines[i].replace(/^\d+\.\s+/, ''));
                i++;
              }
              flushList('ol', olItems);
              continue;
            }

            // 表格
            if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
              var headerCells = line.split('|').map(function (c) { return c.trim(); }).filter(function (c, idx, arr) { return !(idx === 0 && c === '') && !(idx === arr.length - 1 && c === ''); });
              i += 2;
              var rows = [];
              while (i < lines.length && /\|/.test(lines[i])) {
                rows.push(lines[i].split('|').map(function (c) { return c.trim(); }).filter(function (c, idx, arr) { return !(idx === 0 && c === '') && !(idx === arr.length - 1 && c === ''); }));
                i++;
              }
              var thead = '<tr>' + headerCells.map(function (c) { return '<th>' + renderInline(c) + '</th>'; }).join('') + '</tr>';
              var tbody = rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + renderInline(c) + '</td>'; }).join('') + '</tr>'; }).join('');
              html.push('<table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>');
              continue;
            }

            // 分隔线
            if (/^(-{3,}|\*{3,})\s*$/.test(line)) {
              html.push('<hr />');
              i++;
              continue;
            }

            // 空行
            if (line.trim() === '') {
              i++;
              continue;
            }

            // 段落
            var paras = [];
            while (
              i < lines.length &&
              lines[i].trim() !== '' &&
              !/^(#{1,6})\s+/.test(lines[i]) &&
              !/^[-*+]\s+/.test(lines[i]) &&
              !/^\d+\.\s+/.test(lines[i]) &&
              !/^>\s?/.test(lines[i]) &&
              !/^```/.test(lines[i])
            ) {
              paras.push(lines[i]);
              i++;
            }
            html.push('<p>' + renderInline(paras.join(' ')) + '</p>');
          }

          return html.join('\n');
        }

        var input = document.getElementById('md-input');
        var preview = document.getElementById('md-preview');

        var SAMPLE = [
          '# 欢迎使用 Markdown 阅读器',
          '',
          '这是一个**纯前端**的迷你演示，实时渲染你输入的 Markdown。',
          '',
          '## 支持的特性',
          '',
          '- 标题 / 段落 / 列表',
          '- **加粗**、*斜体*、`行内代码`',
          '- 引用、表格、代码块',
          '',
          '> 主题会跟随主站深浅色自动切换。',
          '',
          '| 特性 | 状态 |',
          '| --- | --- |',
          '| 实时预览 | 已支持 |',
          '| 离线运行 | 已支持 |',
          '',
          '```js',
          "console.log('hello, markdown');",
          '```',
        ].join('\n');

        function render() {
          preview.innerHTML = renderMarkdown(input.value);
        }

        input.addEventListener('input', render);

        // 「在新标签打开」按钮
        document.getElementById('open-new-tab').addEventListener('click', function () {
          window.open(window.location.href, '_blank', 'noopener');
        });

        // 初始化
        input.value = SAMPLE;
        render();
      })();
    </script>
  </body>
</html>
