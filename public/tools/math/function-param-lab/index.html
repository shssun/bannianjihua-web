<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数学参数实验室</title>
    <style>
      :root {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --card: #111827;
        --border: rgba(148, 163, 184, 0.2);
        --primary: #38bdf8;
        --primary-soft: rgba(56, 189, 248, 0.14);
        --accent: #a78bfa;
        --warn: #fbbf24;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }
      h1 { font-size: 1.15rem; margin: 0 0 14px; font-weight: 700; }
      .layout { display: flex; gap: 18px; flex-wrap: wrap; }
      .canvas-wrap {
        flex: 1 1 520px;
        min-width: 320px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 12px;
      }
      canvas { display: block; width: 100%; height: auto; }
      .side { flex: 0 0 300px; min-width: 280px; display: flex; flex-direction: column; gap: 14px; }
      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 14px;
      }
      .group-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
      .group-tab {
        padding: 5px 10px; font-size: 0.8rem; border-radius: 7px;
        border: 1px solid var(--border); background: transparent; color: var(--muted);
        cursor: pointer; font-family: inherit;
      }
      .group-tab.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
      .scene-tabs { display: flex; flex-direction: column; gap: 5px; }
      .scene-tab {
        padding: 8px 10px; font-size: 0.85rem; border-radius: 8px;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
        cursor: pointer; text-align: left; font-family: inherit;
      }
      .scene-tab.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
      .scene-tab .sub { display: block; font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
      .param { margin-bottom: 12px; }
      .param:last-child { margin-bottom: 0; }
      .param-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      .param-label { font-size: 0.85rem; font-weight: 600; }
      .param-val { font-size: 0.82rem; color: var(--primary); font-variant-numeric: tabular-nums; }
      .param-row { display: flex; align-items: center; gap: 8px; }
      .param-row input[type=range] { flex: 1; accent-color: var(--primary); }
      .zero-btn, .preset-btn {
        padding: 2px 8px; font-size: 0.72rem; border-radius: 6px;
        border: 1px solid var(--border); background: transparent; color: var(--muted);
        cursor: pointer; font-family: inherit; white-space: nowrap;
      }
      .zero-btn:hover, .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
      .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
      .readout { font-size: 0.82rem; line-height: 1.7; }
      .readout .lbl { color: var(--muted); }
      .readout code { color: var(--accent); font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .conclude { font-size: 0.88rem; line-height: 1.6; padding: 10px 12px; border-radius: 8px; background: var(--primary-soft); border: 1px solid var(--border); }
      .conclude.warn { background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.35); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>数学参数实验室</h1>
    <div class="layout">
      <div class="canvas-wrap">
        <canvas id="cv" width="800" height="560"></canvas>
      </div>
      <div class="side">
        <div class="panel" id="tabs-panel"></div>
        <div class="panel" id="params-panel"></div>
        <div class="panel">
          <div class="readout" id="readout"></div>
        </div>
        <div class="conclude" id="conclude"></div>
      </div>
    </div>

    <script>
    (function () {
      'use strict';

      // ---------- 通用工具函数 ----------
      function fmt(n) {
        if (typeof n !== 'number' || !isFinite(n)) return String(n);
        var s = Number(n.toFixed(3)).toString();
        return s;
      }
      function fmtRange(n) {
        if (!isFinite(n)) return (n > 0 ? '+∞' : '−∞');
        return fmt(n);
      }
      function gcd(a, b) {
        a = Math.abs(a); b = Math.abs(b);
        while (b) { var t = a % b; a = b; b = t; }
        return a;
      }
      // 把 α 近似为最简分数 p/q（分母 ≤ 12）；失败 = 无理数
      function fracApprox(alpha) {
        for (var q = 1; q <= 12; q++) {
          var p = Math.round(alpha * q);
          if (Math.abs(alpha - p / q) < 1e-9) {
            var g = gcd(p, q) || 1;
            return { p: p / g, q: q / g };
          }
        }
        return null;
      }
      // 值显示为 π 的十二分之几（能精确匹配时），否则小数
      function fmtPi(v) {
        var k = Math.round(v / (Math.PI / 12));
        if (Math.abs(v - k * Math.PI / 12) < 1e-9) {
          if (k === 0) return '0';
          var sign = k < 0 ? '−' : '';
          var n = Math.abs(k), den = 12;
          var g = gcd(n, den) || 1;
          n /= g; den /= g;
          var numStr = (n === 1) ? 'π' : n + 'π';
          return sign + (den === 1 ? numStr : numStr + '/' + den);
        }
        return fmt(v);
      }

      // ---------- 幂函数：域规则（分母 ≤ 12 的分数近似） ----------
      function powerDomain(alpha) {
        if (alpha === 0) return { dom: 'x ≠ 0', ran: '{1}', row: 'α = 0' };
        var f = fracApprox(alpha);
        if (!f) return { dom: '(0, +∞)', ran: '(0, +∞)', row: 'α 为无理数' };
        var p = f.p, q = f.q;
        if (q === 1) {
          if (p > 0) return { dom: 'ℝ', ran: (p % 2 ? 'ℝ' : '[0, +∞)'), row: 'α = ' + p + '（正整数）' };
          return { dom: 'x ≠ 0', ran: ((-p) % 2 ? 'y ≠ 0' : '(0, +∞)'), row: 'α = ' + p + '（负整数）' };
        }
        if (q % 2 === 1) {
          return { dom: 'ℝ', ran: (p % 2 ? 'ℝ' : '[0, +∞)'), row: 'α = ' + p + '/' + q + '（最简，q 奇）' };
        }
        return {
          dom: (p > 0 ? '[0, +∞)' : '(0, +∞)'),
          ran: (p > 0 ? '[0, +∞)' : '(0, +∞)'),
          row: 'α = ' + p + '/' + q + '（最简，q 偶）',
        };
      }
      function powerValue(x, alpha) {
        if (alpha === 0) return (x === 0) ? NaN : 1;
        var f = fracApprox(alpha);
        if (!f) return (x <= 0) ? NaN : Math.pow(x, alpha);
        var p = f.p, q = f.q;
        if (q === 1) {
          if (x === 0 && p < 0) return NaN;
          return Math.pow(x, p);
        }
        if (q % 2 === 1) {
          if (x === 0) return (p < 0) ? NaN : 0;
          return (x > 0 ? 1 : -1) * Math.pow(Math.abs(x), p / q);
        }
        if (x < 0) return NaN;
        if (x === 0) return (p > 0) ? 0 : NaN;
        return Math.pow(x, p / q);
      }

      // ---------- 等比数列 Sₙ ----------
      function geoSn(n, q) {
        if (q === 1) return n; // 临界分支：Sₙ = n·a₁（a₁=1），绝不代入含 (1−q) 分母的公式
        return (1 - Math.pow(q, n)) / (1 - q);
      }

      // ---------- 场景定义 ----------
      // 每个场景：id / group / label / sub / params / fn(x,p)? / fit(p)? / plotRange? / overlay(h)? / readout(p) / conclude(p)
      // overlay 的 h：{ p, view, x2px, y2px, dash, dot, vband }
      var SCENARIOS = [
        // ===== 组一：函数与基本初等 =====
        {
          id: 'quadratic',
          group: '函数与基本初等',
          label: 'y = ax² + bx + c',
          sub: '二次 · a=0 退化 · Δ 判别',
          params: [
            { key: 'a', min: -3, max: 3, step: 0.1, def: 1 },
            { key: 'b', min: -5, max: 5, step: 0.5, def: 0 },
            { key: 'c', min: -5, max: 5, step: 0.5, def: 0 },
          ],
          fn: function (x, p) { return p.a * x * x + p.b * x + p.c; },
          overlay: function (h) {
            // Δ ≥ 0 时画出与 x 轴的交点（个数由 Δ 符号解析判定，非采样）
            var p = h.p;
            if (p.a === 0) return;
            var D = p.b * p.b - 4 * p.a * p.c;
            if (D < 0) return;
            var sq = Math.sqrt(D);
            var x1 = (-p.b - sq) / (2 * p.a);
            var x2 = (-p.b + sq) / (2 * p.a);
            h.dot(x1, 0, '#4ade80', 'x₁');
            if (D > 0) h.dot(x2, 0, '#4ade80', 'x₂');
          },
          readout: function (p) {
            var dom = 'ℝ';
            var ran;
            if (p.a === 0) {
              ran = (p.b === 0) ? '{' + fmt(p.c) + '}' : 'ℝ';
            } else {
              var k = p.c - (p.b * p.b) / (4 * p.a);
              ran = (p.a > 0) ? '[' + fmtRange(k) + ', +∞)' : '(−∞, ' + fmtRange(k) + ']';
            }
            var lines = '定义域：<code>' + dom + '</code><br>值域：<code>' + ran + '</code>';
            if (p.a !== 0) {
              var D = p.b * p.b - 4 * p.a * p.c;
              var cnt = (D > 0) ? '2 个' : (D === 0 ? '1 个（相切）' : '0 个');
              var extra = '<br>Δ = b²−4ac = <code>' + fmt(D) + '</code>，与 x 轴交点：<code>' + cnt + '</code>';
              if (D >= 0) {
                var sq = Math.sqrt(D);
                extra += '，x = ' + fmt((-p.b - sq) / (2 * p.a)) + ' 或 ' + fmt((-p.b + sq) / (2 * p.a));
              } else {
                extra += '（无实根）';
              }
              lines += extra;
            }
            return lines;
          },
          conclude: function (p) {
            if (p.a === 0) {
              return 'a=0 使二次项消失，图象退化为直线 y = ' + fmt(p.b) + 'x + ' + fmt(p.c);
            }
            var D = p.b * p.b - 4 * p.a * p.c;
            if (D === 0) return '临界 · Δ=0：两个相等的实根，抛物线与 x 轴相切、恰 1 个交点（不是 2 个，也不是没有根）';
            var k = p.c - (p.b * p.b) / (4 * p.a);
            var head = (p.a > 0)
              ? '开口向上，值域 [' + fmtRange(k) + ', +∞)；对称轴 x = −b/(2a) = ' + fmt(-p.b / (2 * p.a))
              : '开口向下，值域 (−∞, ' + fmtRange(k) + ']；对称轴 x = −b/(2a) = ' + fmt(-p.b / (2 * p.a));
            if (D < 0) return head + '；Δ<0：与 x 轴无交点，方程无实根';
            return head + '；Δ>0：与 x 轴有 2 个交点';
          },
        },
        {
          id: 'linear',
          group: '函数与基本初等',
          label: 'y = kx + b',
          sub: '一次 · k=0 退化',
          params: [
            { key: 'k', min: -5, max: 5, step: 0.5, def: 1 },
            { key: 'b', min: -5, max: 5, step: 0.5, def: 0 },
          ],
          fn: function (x, p) { return p.k * x + p.b; },
          readout: function (p) {
            var dom = 'ℝ';
            var ran = (p.k === 0) ? '{' + fmt(p.b) + '}' : 'ℝ';
            return '定义域：<code>' + dom + '</code><br>值域：<code>' + ran + '</code>';
          },
          conclude: function (p) {
            if (p.k === 0) return 'k=0 退化为常函数 y = ' + fmt(p.b) + '（不是「斜率为 0 的一次函数」）';
            return '一次函数，斜率 k = ' + fmt(p.k) + '，截距 b = ' + fmt(p.b);
          },
        },
        {
          id: 'inverse',
          group: '函数与基本初等',
          label: 'y = k / x',
          sub: '反比例 · x=0 断开',
          params: [
            { key: 'k', min: -5, max: 5, step: 0.5, def: 1 },
          ],
          fn: function (x, p) {
            if (x === 0) return NaN;
            return p.k / x;
          },
          readout: function () {
            return '定义域：<code>(−∞, 0) ∪ (0, +∞)</code><br>值域：<code>(−∞, 0) ∪ (0, +∞)</code>（k≠0）';
          },
          conclude: function (p) {
            if (p.k === 0) return 'k=0，y = 0（x ≠ 0）';
            return (p.k > 0 ? 'k > 0，图象在第一、三象限' : 'k < 0，图象在第二、四象限');
          },
        },
        {
          id: 'exp',
          group: '函数与基本初等',
          label: 'y = aˣ',
          sub: '指数 · a=1 临界',
          params: [
            { key: 'a', min: 0, max: 4, step: 0.1, def: 2,
              presets: [
                { label: '0.5', value: 0.5 },
                { label: '≈1⁻', value: 0.95 },
                { label: '1（临界）', value: 1 },
                { label: '≈1⁺', value: 1.05 },
                { label: '2', value: 2 },
                { label: 'e≈2.718', value: 2.718281828459045 },
              ] },
          ],
          fn: function (x, p) {
            if (p.a <= 0) return NaN;
            return Math.pow(p.a, x);
          },
          overlay: function (h) {
            // 恒过定点 (0, 1)
            h.dot(0, 1, '#fb923c', '(0,1)');
          },
          readout: function (p) {
            var dom = (p.a > 0) ? 'ℝ' : '（a≤0 时无意义）';
            var ran = (p.a > 0) ? ((p.a === 1) ? '{1}' : '(0, +∞)（恒不随 a 变）') : '—';
            return '定义域：<code>' + dom + '</code><br>值域：<code>' + ran + '</code>';
          },
          conclude: function (p) {
            if (p.a <= 0) return 'a=' + fmt(p.a) + '：底数必须 > 0，a≤0 时 aˣ 无意义，不予绘制';
            if (p.a === 1) return '临界 · a=1：y ≡ 1 是常函数（水平线），不是指数函数（底数须 a>0 且 a≠1）';
            if (p.a > 0.95 && p.a < 1.05) return 'a≈1：曲线塌平，跨过 1 时单调性由减翻增';
            if (p.a < 1) return '0 < a < 1，单调递减；值域恒 (0,+∞)，不随 a 变';
            return 'a > 1，单调递增；值域恒 (0,+∞)，不随 a 变';
          },
        },
        {
          id: 'log',
          group: '函数与基本初等',
          label: 'y = logₐ x',
          sub: '对数 · 底数 ≠1',
          params: [
            { key: 'a', min: 0, max: 4, step: 0.1, def: 2 },
          ],
          fn: function (x, p) {
            if (x <= 0 || p.a <= 0 || p.a === 1) return NaN;
            return Math.log(x) / Math.log(p.a);
          },
          readout: function (p) {
            var valid = p.a > 0 && p.a !== 1;
            var dom = valid ? '(0, +∞)' : '（底数须 >0 且 ≠1）';
            var ran = valid ? 'ℝ' : '—';
            return '定义域：<code>' + dom + '</code><br>值域：<code>' + ran + '</code>';
          },
          conclude: function (p) {
            if (p.a <= 0) return '底数不能为 ' + fmt(p.a) + '，对数无意义';
            if (p.a === 1) return '底数不能为 1，log₁ x 无意义';
            if (p.a < 1) return '0 < a < 1，单调递减';
            return 'a > 1，单调递增';
          },
        },
        {
          id: 'hook',
          group: '函数与基本初等',
          label: 'y = x + a/x',
          sub: '对勾 / 飘带',
          params: [
            { key: 'a', min: -10, max: 10, step: 0.1, def: 1 },
          ],
          fn: function (x, p) {
            if (x === 0) return NaN;
            return x + p.a / x;
          },
          readout: function (p) {
            var dom = '(−∞, 0) ∪ (0, +∞)';
            var ran;
            if (p.a > 0) {
              var v = 2 * Math.sqrt(p.a);
              ran = '(−∞, −' + fmtRange(v) + '] ∪ [' + fmtRange(v) + ', +∞)';
            } else if (p.a === 0) {
              ran = '(−∞, 0) ∪ (0, +∞)';
            } else {
              ran = 'ℝ';
            }
            return '定义域：<code>' + dom + '</code><br>值域：<code>' + ran + '</code>';
          },
          conclude: function (p) {
            if (p.a === 0) return 'a=0 退化成直线 y = x（x ≠ 0）';
            if (p.a > 0) {
              var v = Math.sqrt(p.a);
              return '拐点 (√a, 2√a) = (' + fmtRange(v) + ', ' + fmtRange(2 * v) + ')，对勾函数';
            }
            return 'a < 0 飘带函数，两支分别单调，无最值';
          },
        },
        {
          id: 'power-function-x-alpha',
          group: '函数与基本初等',
          label: 'y = x^α',
          sub: '幂函数 · 定义域跳变',
          params: [
            { key: 'α', min: -3, max: 4, step: 0.1, def: 2,
              presets: [
                { label: '1/3', value: 0.3333333333 },
                { label: '1/2', value: 0.5 },
                { label: '2/3', value: 0.6666666667 },
                { label: '1', value: 1 },
                { label: '2', value: 2 },
                { label: '3', value: 3 },
                { label: '−1', value: -1 },
                { label: '−2', value: -2 },
              ] },
          ],
          fit: function () { return { xMin: -4, xMax: 4, yMin: -4, yMax: 4 }; },
          fn: function (x, p) { return powerValue(x, p['α']); },
          readout: function (p) {
            var d = powerDomain(p['α']);
            return 'α = <code>' + fmt(p['α']) + '</code>（' + d.row + '）<br>' +
              '定义域：<code>' + d.dom + '</code><br>值域：<code>' + d.ran + '</code>';
          },
          conclude: function (p) {
            var a = p['α'];
            if (a === 0) return '临界 · α=0：y ≡ 1（挖去原点）——过原点的上升支变成水平线，定义域突增为 x ≠ 0';
            var f = fracApprox(a);
            if (!f) return 'α 为无理数：定义域收缩为 (0, +∞)，仅第一象限单支';
            if (f.q === 2 && f.p === 1) return 'α = 1/2（q 偶）：仅第一象限；调到 α = 2/3（q 奇）定义域突增为 ℝ——参数只动 1/6，图象凭空多出一整支';
            if (f.q === 3 && f.p === 2) return 'α = 2/3（q 奇）：第三象限出现整支；退回 α = 1/2（q 偶）定义域突变回 [0, +∞)';
            if (f.q === 1 && f.p === 1) return 'α = 1：恰为直线 y = x；0<α<1 上凸平缓，α>1 下凸陡峭，跨 1 只变形态不变域';
            if (f.q === 1 && f.p === -1) return 'α = −1：值域由 (0, +∞) 扩为 y ≠ 0，负半支出现（对比 α=−2 的 (0, +∞)）';
            var d = powerDomain(a);
            return d.row + '：定义域 ' + d.dom + '，值域 ' + d.ran + '（分母 q 的奇偶决定负半轴有无）';
          },
        },
        {
          id: 'quadratic-fixed-axis-moving-interval',
          group: '函数与基本初等',
          label: 'y = x² − 2ax + 3（x∈[1,3]）',
          sub: '定轴动区间 · 最值换点',
          params: [
            { key: 'a', label: '对称轴位置 a', min: -1, max: 5, step: 0.1, def: 1, presets: [1, 2, 3] },
          ],
          fit: function () { return { xMin: -1.5, xMax: 6, yMin: -12, yMax: 12 }; },
          plotRange: [1, 3],
          fn: function (x, p) { return x * x - 2 * p.a * x + 3; },
          overlay: function (h) {
            var p = h.p;
            // 淡虚线画整条抛物线（上下文：看顶点滑出区间）
            ctx.save();
            ctx.strokeStyle = 'rgba(56,189,248,0.25)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            for (var i = 0; i <= 200; i++) {
              var x = h.view.xMin + (i / 200) * (h.view.xMax - h.view.xMin);
              var y = x * x - 2 * p.a * x + 3;
              var px = h.x2px(x), py = h.y2px(y);
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
            h.vband(1, 3, 'rgba(56,189,248,0.07)');
            h.dash(p.a, h.view.yMin, p.a, h.view.yMax, 'rgba(167,139,250,0.7)');
            var f1 = 4 - 2 * p.a, fv = 3 - p.a * p.a, f3 = 12 - 6 * p.a;
            var mnX = (p.a <= 1) ? 1 : (p.a < 3 ? p.a : 3);

              return '2a > 2c = 4：轨迹为椭圆，椭圆上任一点恒有 |PF₁| + |PF₂| = 2a';
            }
            if (ta === 4) return '临界 · 2a=2c：距离之和恰等于两定点距离，轨迹退化为线段 F₁F₂——椭圆定义必须 2a > |F₁F₂| = 2c';
            return '2a < 2c：由三角不等式 |PF₁| + |PF₂| ≥ |F₁F₂| = 4 知不可能成立，轨迹不存在（空集）';

              var b = Math.sqrt(a * a - c * c);
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 2;
              ctx.beginPath();

                var t = i / 180 * Math.PI;
                var px = h.x2px(a * Math.cos(t)), py = h.y2px(b * Math.sin(t));
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
              }
              ctx.stroke();
              h.dot(a / 2, b * Math.sin(Math.PI / 3), '#a78bfa', 'P');
            } else if (a === c) {
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(h.x2px(-2), h.y2px(0));
              ctx.lineTo(h.x2px(2), h.y2px(0));

      ];

      // ---------- 状态 ----------
      var state = {
        sceneIdx: 0,
        activeGroup: SCENARIOS[0].group,
        params: {},
      };

      function loadParams(idx) {
        var s = SCENARIOS[idx];
        var p = {};
        s.params.forEach(function (pr) { p[pr.key] = pr.def; });
        state.params = p;
      }
      loadParams(0);

      // ---------- Canvas ----------
      var canvas = document.getElementById('cv');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var CSS_W = 800, CSS_H = 560;

      function resizeCanvas() {
        var rect = canvas.getBoundingClientRect();
        var w = Math.round(rect.width);
        var h = Math.round(w * 0.7);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.height = h + 'px';
        CSS_W = w;
        CSS_H = h;
      }

      // 取「好看」的刻度步长（1/2/5 × 10^n）
      function niceStep(range) {
        var raw = range / 8;
        var pow = Math.pow(10, Math.floor(Math.log10(raw)));
        var n = raw / pow;
        var step;
        if (n < 1.5) step = 1;
        else if (n < 3) step = 2;
        else if (n < 7) step = 5;
        else step = 10;
        return step * pow;
      }

      function autoView(fn, params) {
        var xMin = -10, xMax = 10;
        var lo = Infinity, hi = -Infinity;
        var hasFinite = false;
        var N = Math.max(200, Math.floor(CSS_W));
        for (var i = 0; i <= N; i++) {
          var x = xMin + (i / N) * (xMax - xMin);
          var y = fn(x, params);
          if (isFinite(y) && Math.abs(y) < 200) {
            if (y < lo) lo = y;
            if (y > hi) hi = y;
            hasFinite = true;
          }
        }
        if (!hasFinite) { lo = -10; hi = 10; }
        if (lo === hi) { lo -= 2; hi += 2; }
        var pad = (hi - lo) * 0.15 || 2;
        var yMin = lo - pad;
        var yMax = hi + pad;
        if (yMin > -2) yMin = -2;
        if (yMax < 2) yMax = 2;
        return { xMin: xMin, xMax: xMax, yMin: yMin, yMax: yMax };
      }

      function computeView(scene) {
        if (scene.fit) return scene.fit(state.params);
        return autoView(scene.fn, state.params);
      }

      function drawGrid(view) {
        var xMin = view.xMin, xMax = view.xMax, yMin = view.yMin, yMax = view.yMax;
        var xStep = niceStep(xMax - xMin);
        var yStep = niceStep(yMax - yMin);

        ctx.strokeStyle = 'rgba(148,163,184,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var x = Math.ceil(xMin / xStep) * xStep; x <= xMax; x += xStep) {
          var px = (x - xMin) / (xMax - xMin) * CSS_W;
          ctx.moveTo(px, 0);
          ctx.lineTo(px, CSS_H);
        }
        for (var y = Math.ceil(yMin / yStep) * yStep; y <= yMax; y += yStep) {
          var py = CSS_H - (y - yMin) / (yMax - yMin) * CSS_H;
          ctx.moveTo(0, py);
          ctx.lineTo(CSS_W, py);
        }
        ctx.stroke();

        // 坐标轴
        ctx.strokeStyle = 'rgba(148,163,184,0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        var x0 = (0 - xMin) / (xMax - xMin) * CSS_W;
        var y0 = CSS_H - (0 - yMin) / (yMax - yMin) * CSS_H;
        ctx.moveTo(0, y0); ctx.lineTo(CSS_W, y0);
        ctx.moveTo(x0, 0); ctx.lineTo(x0, CSS_H);
        ctx.stroke();

        // 刻度数字
        ctx.fillStyle = 'rgba(148,163,184,0.8)';
        ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (var gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax; gx += xStep) {
          if (Math.abs(gx) < xStep * 0.01) continue;
          var gpx = (gx - xMin) / (xMax - xMin) * CSS_W;
          ctx.fillText(fmt(gx), gpx, y0 + 4);
        }
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (var gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax; y += yStep) {
          if (Math.abs(gy) < yStep * 0.01) continue;
          var gpy = CSS_H - (gy - yMin) / (yMax - yMin) * CSS_H;
          ctx.fillText(fmt(gy), x0 - 5, gpy);
        }
        // 原点
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText('0', x0 - 4, y0 + 4);
      }

      function drawCurve(scene, view) {
        var xMin = view.xMin, xMax = view.xMax, yMin = view.yMin, yMax = view.yMax;
        var fn = scene.fn;
        var params = state.params;
        var yRange = yMax - yMin;
        var breakThreshold = 1.5 * yRange;

        // plotRange：只画该 x 区间（如定区间最值的 [1,3] 段）
        var xLo = xMin, xHi = xMax;
        if (scene.plotRange) {
          xLo = Math.max(xLo, scene.plotRange[0]);
          xHi = Math.min(xHi, scene.plotRange[1]);
        }
        if (xHi <= xLo) return;

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();

        var cols = Math.max(400, Math.floor(CSS_W));
        var prevY = null;
        var prevFinite = false;
        for (var i = 0; i <= cols; i++) {
          var x = xLo + (i / cols) * (xHi - xLo);
          var y = fn(x, params);
          var finite = isFinite(y);

          var px = (x - xMin) / (xMax - xMin) * CSS_W;
          var py = CSS_H - (y - yMin) / yRange * CSS_H;

          if (!finite) {
            prevFinite = false;
            prevY = null;
            continue;
          }
          // 检测跨渐近线：相邻有限点符号相反且 Δy 巨大
          var asymptoteBreak = prevFinite && (prevY * y < 0) && (Math.abs(y - prevY) > breakThreshold);
          if (!prevFinite || asymptoteBreak) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
          prevY = y;
          prevFinite = true;
        }
        ctx.stroke();
      }

      // overlay 绘制辅助
      function mkHelpers(view) {
        var xSpan = view.xMax - view.xMin;
        var ySpan = view.yMax - view.yMin;
        function x2px(x) { return (x - view.xMin) / xSpan * CSS_W; }
        function y2px(y) { return CSS_H - (y - view.yMin) / ySpan * CSS_H; }
        function dash(x1, y1, x2, y2, color) {
          ctx.save();
          ctx.setLineDash([5, 4]);
          ctx.strokeStyle = color || 'rgba(167,139,250,0.7)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x2px(x1), y2px(y1));
          ctx.lineTo(x2px(x2), y2px(y2));
          ctx.stroke();
          ctx.restore();
        }
        function dot(x, y, color, label) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x2px(x), y2px(y), 4.5, 0, Math.PI * 2);
          ctx.fill();
          if (label) {
            ctx.fillStyle = '#e5e7eb';
            ctx.font = '11px system-ui, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(label, x2px(x) + 6, y2px(y) - 4);
          }
        }
        function vband(x1, x2, fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(x2px(x1), 0, x2px(x2) - x2px(x1), CSS_H);
        }
        return { p: state.params, view: view, x2px: x2px, y2px: y2px, dash: dash, dot: dot, vband: vband };
      }

      var rafPending = false;
      function scheduleDraw() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(draw);
      }

      function draw() {
        rafPending = false;
        resizeCanvas();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, CSS_W, CSS_H);
        var scene = SCENARIOS[state.sceneIdx];
        var view = computeView(scene);
        drawGrid(view);
        if (scene.fn) drawCurve(scene, view);
        if (scene.overlay) scene.overlay(mkHelpers(view));
      }

      // ---------- UI 构建 ----------
      function renderTabs() {
        var panel = document.getElementById('tabs-panel');
        var groups = [];
        SCENARIOS.forEach(function (s) {
          if (groups.indexOf(s.group) < 0) groups.push(s.group);
        });
        if (groups.indexOf(state.activeGroup) < 0) state.activeGroup = groups[0];

        var html = '<div class="group-tabs">';
        groups.forEach(function (g) {
          html += '<button class="group-tab' + (g === state.activeGroup ? ' active' : '') +
            '" data-group="' + g + '">' + g + '</button>';
        });
        html += '</div><div class="scene-tabs" id="scene-tabs">';
        SCENARIOS.forEach(function (s, i) {
          if (s.group !== state.activeGroup) return;
          html += '<button class="scene-tab' + (i === state.sceneIdx ? ' active' : '') +
            '" data-idx="' + i + '">' + s.label + '<span class="sub">' + s.sub + '</span></button>';
        });
        html += '</div>';
        panel.innerHTML = html;

        panel.querySelectorAll('.group-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.activeGroup = btn.dataset.group;
            // 切组时定位到该组第一个场景
            for (var i = 0; i < SCENARIOS.length; i++) {
              if (SCENARIOS[i].group === state.activeGroup) { state.sceneIdx = i; break; }
            }
            loadParams(state.sceneIdx);
            renderTabs();
            renderParams();
            updateReadout();
            scheduleDraw();
          });
        });
        panel.querySelectorAll('.scene-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.sceneIdx = parseInt(btn.dataset.idx, 10);
            loadParams(state.sceneIdx);
            renderTabs();
            renderParams();
            updateReadout();
            scheduleDraw();
          });
        });
      }

      function renderParams() {
        var panel = document.getElementById('params-panel');
        var scene = SCENARIOS[state.sceneIdx];
        var html = '';
        scene.params.forEach(function (pr) {
          var val = state.params[pr.key];
          var label = pr.label || pr.key;
          html += '<div class="param">' +
            '<div class="param-head"><span class="param-label">' + label + '</span>' +
            '<span class="param-val">' + fmt(val) + '</span></div>' +
            '<div class="param-row">' +
            '<input type="range" min="' + pr.min + '" max="' + pr.max + '" step="' + pr.step +
            '" value="' + val + '" data-key="' + pr.key + '">';
          if (pr.min <= 0 && pr.max >= 0) {
            html += '<button class="zero-btn" data-key="' + pr.key + '">归零</button>';
          }
          html += '</div>';
          if (pr.presets && pr.presets.length) {
            html += '<div class="presets">';
            pr.presets.forEach(function (ps) {
              var isNum = (typeof ps === 'number');
              var lb = isNum ? fmt(ps) : ps.label;
              var vv = isNum ? ps : ps.value;
              html += '<button class="preset-btn" data-key="' + pr.key + '" data-val="' + vv + '">' + lb + '</button>';
            });
            html += '</div>';
          }
          html += '</div>';
        });
        panel.innerHTML = html;

        function setParam(key, value, input) {
          state.params[key] = value;
          if (input) input.value = value;
          var inp = panel.querySelector('input[data-key="' + key + '"]');
          var lbl = inp.closest('.param').querySelector('.param-val');
          lbl.textContent = fmt(state.params[key]);
          updateReadout();
          scheduleDraw();
        }

        panel.querySelectorAll('input[type=range]').forEach(function (inp) {
          inp.addEventListener('input', function () {
            var k = inp.dataset.key;
            setParam(k, parseFloat(inp.value), null);
          });
        });
        panel.querySelectorAll('.zero-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var k = btn.dataset.key;
            setParam(k, 0, null);
          });
        });
        panel.querySelectorAll('.preset-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var k = btn.dataset.key;
            setParam(k, parseFloat(btn.dataset.val), null);
          });
        });
      }

      function updateReadout() {
        var scene = SCENARIOS[state.sceneIdx];
        document.getElementById('readout').innerHTML =
          '<span class="lbl">解析式：</span><code>' + scene.label + '</code><br>' +
          scene.readout(state.params);
        var conc = scene.conclude(state.params);
        var cEl = document.getElementById('conclude');
        cEl.textContent = conc;
        var isWarn = /退化|无意义|失效|临界|不存在|不是指数函数|须|无意义/.test(conc);
        cEl.className = 'conclude' + (isWarn ? ' warn' : '');
      }

      // ---------- 启动 ----------
      window.addEventListener('resize', scheduleDraw);
      renderTabs();
      renderParams();
      updateReadout();
      draw();
    })();
    </script>
  </body>
</html>
